# Every hour (and on demand): read Nadia's Google Sheet, rebuild the site if it changed, commit.
# A sheet with errors fails this run and changes nothing; GitHub emails the repo owner.
name: Sincronizar desde la hoja

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la hoja
        id: sync
        run: |
          set +e
          python3 tools/sheets.py sync
          code=$?
          set -e
          if [ "$code" = 2 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"

      - name: Reconstruir y publicar
        if: steps.sync.outputs.changed == 'true'
        run: |
          pip install --quiet pillow==13.0.0
          python3 tools/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar contenido desde la hoja de Nadia"
          git push
          # a push made with GITHUB_TOKEN may not start a Pages build on its own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
        env:
          GH_TOKEN: ${{ github.token }}
